<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noir Knowledge Base & Chatbot Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background-color: #08080a;
            color: #e2e8f0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }
        .crimson-glow {
            box-shadow: 0 0 25px rgba(220, 38, 38, 0.25);
        }
        .crimson-border {
            border-color: rgba(220, 38, 38, 0.4);
        }
        .crimson-btn {
            background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
            transition: all 0.2s ease-in-out;
        }
        .crimson-btn:hover {
            background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.5);
        }
        .glass-panel {
            background: rgba(18, 18, 24, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <!-- Header -->
    <header class="max-w-7xl mx-auto flex justify-between items-center pb-6 mb-8 border-b border-zinc-800">
        <div class="flex items-center gap-3">
            <div class="w-3 h-8 bg-red-600 rounded-full crimson-glow"></div>
            <h1 class="text-2xl font-bold tracking-wider uppercase text-white">Noir <span class="text-red-500">Control Hub</span></h1>
        </div>
        <button onclick="toggleModal('settings-modal')" class="px-4 py-2 text-sm rounded bg-zinc-900 border border-zinc-700 hover:border-red-500 text-zinc-300 hover:text-white transition">
            ⚙ Settings
        </button>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- Left Column: File Upload & Access Manager -->
        <section class="lg:col-span-7 flex flex-col gap-6">
            
            <!-- Drag & Drop Upload Zone -->
            <div id="drop-zone" class="glass-panel p-8 rounded-xl border-2 border-dashed border-zinc-700 hover:border-red-500/60 transition text-center cursor-pointer relative overflow-hidden group">
                <input type="file" id="file-input" class="hidden" multiple onchange="handleFileSelect(event)">
                <div class="flex flex-col items-center gap-3">
                    <svg class="w-12 h-12 text-red-500 group-hover:scale-110 transition duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 16a4 4 0 01-.88-7.903A5 5 0 0115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                    </svg>
                    <p class="text-lg font-medium text-zinc-200">Drag & drop files here to upload</p>
                    <p class="text-sm text-zinc-500">Or click to browse from your device</p>
                </div>
            </div>

            <!-- Documents Table -->
            <div class="glass-panel rounded-xl p-6 crimson-border">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-semibold text-white tracking-wide">Knowledge Base Files</h2>
                    <button onclick="loadFiles()" class="text-xs text-zinc-400 hover:text-red-400 transition">↻ Refresh</button>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-zinc-800 text-zinc-500 text-xs uppercase tracking-wider">
                                <th class="py-3 px-2">File Name</th>
                                <th class="py-3 px-2">Access Control</th>
                                <th class="py-3 px-2 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="file-table-body" class="divide-y divide-zinc-800/50 text-sm">
                            <tr>
                                <td colspan="3" class="py-6 text-center text-zinc-500">Loading files...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- Right Column: Interactive Chat Tester -->
        <section class="lg:col-span-5">
            <div class="glass-panel rounded-xl p-6 crimson-glow border border-red-900/40 h-full flex flex-col justify-between">
                <div>
                    <div class="flex justify-between items-center mb-4 pb-3 border-b border-zinc-800">
                        <h2 class="text-lg font-semibold text-white tracking-wide">Chatbot Preview</h2>
                        <label class="flex items-center gap-2 text-xs text-zinc-400 cursor-pointer">
                            <input type="checkbox" id="admin-mode-toggle" class="rounded bg-zinc-900 border-zinc-700 text-red-600 focus:ring-0">
                            Admin Mode
                        </label>
                    </div>

                    <!-- Chat Messages Area -->
                    <div id="chat-box" class="h-[420px] overflow-y-auto pr-2 flex flex-col gap-3 text-sm">
                        <div class="bg-zinc-900/80 p-3 rounded-lg border border-zinc-800 max-w-[85%] text-zinc-300">
                            Hello! Ask me any questions regarding the uploaded documents.
                        </div>
                    </div>
                </div>

                <!-- Chat Input Form -->
                <form onsubmit="sendMessage(event)" class="mt-4 flex gap-2">
                    <input type="text" id="chat-input" placeholder="Ask a question..." required class="flex-1 bg-zinc-900 border border-zinc-800 focus:border-red-500 text-white rounded-lg px-4 py-2.5 text-sm focus:outline-none">
                    <button type="submit" class="crimson-btn text-white px-5 py-2.5 rounded-lg text-sm font-medium">
                        Send
                    </button>
                </form>
            </div>
        </section>

    </main>

    <!-- Settings Modal -->
    <div id="settings-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="glass-panel rounded-xl p-6 w-full max-w-md crimson-border">
            <h3 class="text-xl font-bold text-white mb-4">API Configuration</h3>
            <div class="flex flex-col gap-4 text-sm">
                <div>
                    <label class="block text-zinc-400 mb-1">Supabase URL</label>
                    <input type="text" id="cfg-sb-url" class="w-full bg-zinc-900 border border-zinc-800 text-zinc-200 rounded px-3 py-2 focus:outline-none focus:border-red-500">
                </div>
                <div>
                    <label class="block text-zinc-400 mb-1">Supabase Anon Key</label>
                    <input type="password" id="cfg-sb-key" class="w-full bg-zinc-900 border border-zinc-800 text-zinc-200 rounded px-3 py-2 focus:outline-none focus:border-red-500">
                </div>
                <div>
                    <label class="block text-zinc-400 mb-1">Backend API Base URL</label>
                    <input type="text" id="cfg-backend-url" class="w-full bg-zinc-900 border border-zinc-800 text-zinc-200 rounded px-3 py-2 focus:outline-none focus:border-red-500">
                </div>
            </div>
            <div class="flex justify-end gap-3 mt-6">
                <button onclick="toggleModal('settings-modal')" class="px-4 py-2 text-sm text-zinc-400 hover:text-white">Cancel</button>
                <button onclick="saveSettings()" class="crimson-btn px-4 py-2 rounded text-sm font-medium text-white">Save Changes</button>
            </div>
        </div>
    </div>

    <!-- Application Script Logic -->
    <script>
        let supabaseClient = null;

        function toggleModal(id) {
            document.getElementById(id).classList.toggle('hidden');
        }

        function initSupabase() {
            const url = localStorage.getItem('noir_sb_url');
            const key = localStorage.getItem('noir_sb_key');
            if (url && key && window.supabase) {
                supabaseClient = window.supabase.createClient(url, key);
                loadFiles();
            }
        }

        async function loadFiles() {
            if (!supabaseClient) return;
            const tableBody = document.getElementById('file-table-body');
            
            try {
                const { data, error } = await supabaseClient.from('chatbot_files').select('*');
                if (error) throw error;

                if (!data || data.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="3" class="py-6 text-center text-zinc-500">No documents found in knowledge base.</td></tr>`;
                    return;
                }

                tableBody.innerHTML = data.map(file => `
                    <tr class="hover:bg-zinc-900/50">
                        <td class="py-3 px-2 font-medium text-zinc-200">${file.file_name}</td>
                        <td class="py-3 px-2">
                            <button onclick="toggleAccess('${file.file_name}', '${file.access_level}')" class="px-3 py-1 rounded-full text-xs font-semibold ${file.access_level === 'public' ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' : 'bg-red-950 text-red-400 border border-red-800'}">
                                ${file.access_level.toUpperCase()}
                            </button>
                        </td>
                        <td class="py-3 px-2 text-right">
                            <button onclick="deleteFile('${file.file_name}')" class="text-zinc-500 hover:text-red-400 transition text-xs">Delete</button>
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                tableBody.innerHTML = `<tr><td colspan="3" class="py-6 text-center text-red-400">Error loading files: ${err.message}</td></tr>`;
            }
        }

        async function toggleAccess(fileName, currentLevel) {
            const newLevel = currentLevel === 'public' ? 'private' : 'public';
            const { error } = await supabaseClient.from('chatbot_files').update({ access_level: newLevel }).eq('file_name', fileName);
            if (!error) loadFiles();
        }

        async function deleteFile(fileName) {
            if (!confirm(`Delete ${fileName}?`)) return;
            await supabaseClient.storage.from('chatbot_files').remove([fileName]);
            await supabaseClient.from('chatbot_files').delete().eq('file_name', fileName);
            loadFiles();
        }

        // Drag & drop logic
        const dropZone = document.getElementById('drop-zone');
        dropZone.addEventListener('click', () => document.getElementById('file-input').click());
        dropZone.addEventListener('dragover', (e) => e.preventDefault());
        dropZone.addEventListener('drop', async (e) => {
            e.preventDefault();
            const files = e.dataTransfer.files;
            uploadFiles(files);
        });

        function handleFileSelect(e) {
            uploadFiles(e.target.files);
        }

        async function uploadFiles(files) {
            console.log("uploadFiles triggered with files:", files);
            if (!supabaseClient) {
                console.error("Supabase client is not initialized!");
                return alert('Configure Supabase settings first!');
            }
            
            for (let file of files) {
                console.log("Uploading to storage:", file.name);
                
                // 1. Upload file to Supabase Storage bucket
                const { data: storageData, error: storageError } = await supabaseClient.storage
                    .from('chatbot_files')
                    .upload(file.name, file, { upsert: true });

                if (storageError) {
                    console.error('Storage error details:', storageError);
                    continue;
                }
                console.log("Storage upload success:", storageData);

                // 2. Insert or update the metadata record in the database table
                console.log("Inserting metadata to database...");
                const { error: dbError } = await supabaseClient
                    .from('chatbot_files')
                    .upsert([
                        { 
                            file_name: file.name, 
                            file_path: file.name, 
                            access_level: 'public' 
                        }
                    ], { onConflict: 'file_name' });

                if (dbError) {
                    console.error('Database metadata error details:', dbError);
                } else {
                    console.log("Database metadata successfully inserted/updated!");
                }
            }
            loadFiles();
        }

        async function sendMessage(e) {
            e.preventDefault();
            const input = document.getElementById('chat-input');
            const chatBox = document.getElementById('chat-box');
            const isAdmin = document.getElementById('admin-mode-toggle').checked;
            const backendUrl = localStorage.getItem('noir_backend_url');

            const query = input.value.trim();
            if (!query) return;

            chatBox.innerHTML += `<div class="bg-red-950/40 border border-red-900/50 p-3 rounded-lg ml-auto max-w-[85%] text-white">${query}</div>`;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const res = await fetch(`${backendUrl}/api/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query, is_admin: isAdmin })
                });
                
                const data = await res.json();
                console.log("Backend response:", data);
                
                const replyText = data.reply || data.error || JSON.stringify(data) || 'No response field returned.';
                chatBox.innerHTML += `<div class="bg-zinc-900/80 p-3 rounded-lg border border-zinc-800 max-w-[85%] text-zinc-300">${replyText}</div>`;
            } catch (err) {
                console.error("Chat fetch error:", err);
                chatBox.innerHTML += `<div class="bg-zinc-900/80 p-3 rounded-lg border border-red-800 max-w-[85%] text-red-400">Error connecting to backend API: ${err.message}</div>`;
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function saveSettings() {
            localStorage.setItem('noir_sb_url', document.getElementById('cfg-sb-url').value);
            localStorage.setItem('noir_sb_key', document.getElementById('cfg-sb-key').value);
            localStorage.setItem('noir_backend_url', document.getElementById('cfg-backend-url').value);
            toggleModal('settings-modal');
            initSupabase();
        }

        /* 
          ===================================================================
          PRE-CONFIGURATION BLOCK (AUTO-FILL CREDENTIALS)
          ===================================================================
        */
        const DEFAULT_CONFIG = {
            supabaseUrl: 'https://ogqehxgqhciuzrnzbvdg.supabase.co',
            supabaseKey: 'sb_publishable_hrINFWoFQ6I55SdN6Zx5oA_2JcrsZw7',
            backendUrl: 'https://chatbot-kappa-two-85.vercel.app/'
        };

        function autoInitConfig() {
            if (!localStorage.getItem('noir_sb_url')) {
                localStorage.setItem('noir_sb_url', DEFAULT_CONFIG.supabaseUrl);
            }
            if (!localStorage.getItem('noir_sb_key')) {
                localStorage.setItem('noir_sb_key', DEFAULT_CONFIG.supabaseKey);
            }
            if (!localStorage.getItem('noir_backend_url')) {
                localStorage.setItem('noir_backend_url', DEFAULT_CONFIG.backendUrl);
            }

            document.getElementById('cfg-sb-url').value = localStorage.getItem('noir_sb_url');
            document.getElementById('cfg-sb-key').value = localStorage.getItem('noir_sb_key');
            document.getElementById('cfg-backend-url').value = localStorage.getItem('noir_backend_url');

            initSupabase();
        }

        // Initialize on load
        window.addEventListener('DOMContentLoaded', autoInitConfig);
    </script>
</body>
</html>
